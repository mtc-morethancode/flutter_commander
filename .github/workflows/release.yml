name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular release sin crear tag ni release de GitHub'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Create Tag & GitHub Release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' pubspec.yaml)
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not extract version from pubspec.yaml"
            exit 1
          fi
          VERSION="${RAW_VERSION#v}"
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
          echo "Target tag: $TAG"

      - name: Verify Tag Does Not Already Exist
        run: |
          git fetch --tags origin
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on repository! Version bump in pubspec.yaml on main is required."
            exit 1
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          python3 -c "
          import sys, re

          version = sys.argv[1]
          pattern = rf'^##\s+\[?v?{re.escape(version)}(?:\]|\s|$)'
          content = []
          recording = False

          try:
              with open('CHANGELOG.md', 'r') as f:
                  for line in f:
                      if re.match(pattern, line):
                          recording = True
                          continue
                      elif recording and re.match(r'^##\s+', line):
                          break
                      elif recording:
                          content.append(line)
          except Exception as e:
              pass

          output = ''.join(content).strip()
          if output:
              with open('RELEASE_NOTES.md', 'w') as out:
                  out.write(output + '\n')
          " "$VERSION"

          if [ ! -s RELEASE_NOTES.md ] || [ -z "$(tr -d '[:space:]' < RELEASE_NOTES.md)" ]; then
            echo "Release $TAG" > RELEASE_NOTES.md
            if [ -n "${{ github.event.pull_request.number }}" ]; then
              echo "" >> RELEASE_NOTES.md
              echo "Merged from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" >> RELEASE_NOTES.md
            fi
          fi

          echo "--- Release Notes Preview ---"
          cat RELEASE_NOTES.md

      - name: Create and Push Git Tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --target main

      - name: Add Job Summary
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 🚀 Release Processed: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- **Source Branch:** \`${{ github.event.pull_request.head.ref }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **PR:** #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
            echo "> ⚠️ **Aviso sobre automatización pub.dev**: No se detectó el secret \`RELEASE_PAT\`. El tag fue publicado con el \`GITHUB_TOKEN\` predeterminado. Para que GitHub Actions dispare automáticamente el workflow de publicación a **pub.dev** (\`publish.yml\`), configure un Personal Access Token con permiso \`contents: write\` en Repository Secrets como \`RELEASE_PAT\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Tag publicado con \`RELEASE_PAT\`. El workflow \`publish.yml\` se ejecutará automáticamente." >> $GITHUB_STEP_SUMMARY
          fi
