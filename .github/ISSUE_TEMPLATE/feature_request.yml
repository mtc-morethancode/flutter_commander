name: 💡 Feature Request
description: Suggest an idea or architectural enhancement for flutter_commander
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please explain the use case and proposed API.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or architectural pain point?
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the solution or new API you'd like to see implemented.
      placeholder: Introduce a new mixin or policy that...
    validations:
      required: true

  - type: textarea
    id: code_example
    attributes:
      label: Example Code / Usage
      description: How would developers use this feature in their code?
      render: dart
      placeholder: |
        class MyCommander extends Commander<MyState, MyEvent> {
          // Proposed usage
        }
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or screenshots about the feature request.
    validations:
      required: false
